<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOYAJOY - ¡Atrapa la Fruta!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            touch-action: none;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        .font-game {
            font-family: 'Fredoka One', cursive;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.08);
        }

        #gameCanvas {
            border-radius: 1.5rem;
            box-shadow: 0 15px 35px rgba(100, 116, 139, 0.18);
        }

        .btn-bounce {
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease;
        }
        .btn-bounce:hover {
            transform: scale(1.04);
        }
        .btn-bounce:active {
            transform: scale(0.96);
        }

        .character-card.selected {
            transform: scale(1.06);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
        }
    </style>
</head>
<body id="pageBody" class="bg-[#fef5d4] min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div class="relative w-full max-w-xl flex flex-col items-center">

        <!-- Banner Logo Superior (Carga tu imagen real de logo) -->
        <div id="brandBanner" class="w-full mb-2.5 rounded-2xl overflow-hidden shadow-md border-2 border-white flex items-center justify-center bg-[#fef5d4] py-1.5 px-4">
            <img id="logoImage" src="logo-jirafa.png" alt="SOYAJOY" class="max-h-[78px] sm:max-h-[92px] w-auto object-contain">
        </div>

        <!-- Barra Superior de Estadísticas -->
        <div class="w-full flex items-center justify-between mb-2.5 px-4 py-2 rounded-2xl glass-panel">
            <div class="flex items-center space-x-2">
                <div class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-wider">Vidas</div>
                <div id="livesContainer" class="flex space-x-1 text-xl sm:text-2xl">
                    <span>❤️</span><span>❤️</span><span>❤️</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <div class="text-center">
                    <div class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider">Racha</div>
                    <div id="comboDisplay" class="text-base sm:text-lg font-game text-purple-600">x1</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider">Puntos</div>
                    <div id="scoreDisplay" class="text-xl sm:text-2xl font-game text-emerald-600">0</div>
                </div>
            </div>
        </div>

        <!-- Área Canvas de Juego -->
        <div id="canvasWrapper" class="relative w-full aspect-[4/4.5] max-h-[64vh] min-h-[340px]">
            <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

            <!-- Pantalla Inicial: Selección Directa -->
            <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center p-4 sm:p-6 text-center glass-panel rounded-3xl z-20 overflow-y-auto">
                <h1 id="welcomeTitle" class="text-2xl sm:text-3xl font-game text-amber-600 mb-1">
                    ¡Elige tu amigo!
                </h1>
                <p class="text-xs sm:text-sm text-slate-600 mb-4 max-w-sm font-semibold">
                    Toca un animal para jugar y comer su fruta favorita y soja
                </p>

                <!-- 3 Tarjetas con tus imágenes reales -->
                <div class="grid grid-cols-3 gap-2.5 sm:gap-3.5 w-full max-w-md mb-5">
                    <!-- Jirafa -->
                    <button type="button" data-char="giraffe" class="character-card selected btn-bounce flex flex-col items-center p-2.5 sm:p-3 rounded-2xl bg-[#fef5d4] border-4 border-amber-500 text-amber-900">
                        <img src="jirafa.png" alt="Jirafa" class="w-16 h-16 sm:w-20 sm:h-20 object-contain mb-1 rounded-xl">
                        <span class="font-game text-xs sm:text-sm">Jirafa</span>
                        <span class="text-[11px] sm:text-xs font-bold bg-white/90 px-2 py-0.5 rounded-full mt-1 shadow-sm">🍑 Melocotón</span>
                    </button>

                    <!-- Oso Panda -->
                    <button type="button" data-char="panda" class="character-card btn-bounce flex flex-col items-center p-2.5 sm:p-3 rounded-2xl bg-[#fce2e6] border-4 border-transparent text-pink-900">
                        <img src="panda.png" alt="Oso Panda" class="w-16 h-16 sm:w-20 sm:h-20 object-contain mb-1 rounded-xl">
                        <span class="font-game text-xs sm:text-sm">Oso Panda</span>
                        <span class="text-[11px] sm:text-xs font-bold bg-white/90 px-2 py-0.5 rounded-full mt-1 shadow-sm">🍓 Fresas</span>
                    </button>

                    <!-- Cocodrilo -->
                    <button type="button" data-char="crocodile" class="character-card btn-bounce flex flex-col items-center p-2.5 sm:p-3 rounded-2xl bg-[#d7f5cb] border-4 border-transparent text-emerald-900">
                        <img src="cocodrilo.png" alt="Cocodrilo" class="w-16 h-16 sm:w-20 sm:h-20 object-contain mb-1 rounded-xl">
                        <span class="font-game text-xs sm:text-sm">Cocodrilo</span>
                        <span class="text-[11px] sm:text-xs font-bold bg-white/90 px-2 py-0.5 rounded-full mt-1 shadow-sm">🍋 Limón</span>
                    </button>
                </div>

                <!-- Leyenda -->
                <div id="legendBox" class="grid grid-cols-2 gap-2 text-xs text-left bg-white/90 p-3 rounded-2xl mb-5 w-full max-w-sm border-2 border-amber-300">
                    <div class="flex items-center space-x-1.5">
                        <span id="legendGoodEmoji" class="text-lg">🍑 🌱</span>
                        <span class="font-bold text-emerald-600">+10 Puntos</span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span class="text-lg">🦠 🪰</span>
                        <span class="font-bold text-rose-500">Evita (-1 Vida)</span>
                    </div>
                </div>

                <button type="button" id="startBtn" class="btn-bounce bg-gradient-to-r from-amber-500 to-orange-500 text-white font-game text-xl sm:text-2xl py-3 px-12 rounded-full shadow-lg border-2 border-white">
                    ¡JUGAR! 🎮
                </button>
            </div>

            <!-- Pantalla Pausa -->
            <div id="pauseScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center glass-panel rounded-3xl z-20">
                <div class="text-5xl mb-2">⏸️</div>
                <h2 class="text-3xl sm:text-4xl font-game text-sky-500 mb-4">Juego en Pausa</h2>
                <button type="button" id="resumeBtn" class="btn-bounce bg-sky-400 hover:bg-sky-500 text-white font-game text-lg py-3 px-8 rounded-full shadow-md mb-3 border-2 border-white">
                    Continuar ▶️
                </button>
                <button type="button" id="changeCharPauseBtn" class="btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-800 font-game text-sm py-2.5 px-6 rounded-full mb-2">
                    Cambiar Animal
                </button>
                <button type="button" id="restartPauseBtn" class="btn-bounce bg-slate-200 hover:bg-slate-300 text-slate-700 font-game text-sm py-2 px-5 rounded-full">
                    Reiniciar 🔄
                </button>
            </div>

            <!-- Pantalla Fin del Juego -->
            <div id="gameOverScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center glass-panel rounded-3xl z-20">
                <div class="text-5xl mb-2">🌟</div>
                <h2 class="text-3xl sm:text-4xl font-game text-rose-500 mb-1">¡Muy bien!</h2>
                <p id="gameOverSubtitle" class="text-sm text-slate-600 mb-4 font-semibold">¡Qué rico estuvo todo!</p>

                <div class="bg-white/90 rounded-2xl p-4 w-full max-w-xs mb-5 border-2 border-rose-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-400">PUNTUACIÓN FINAL</span>
                        <span id="finalScore" class="font-game text-2xl text-emerald-600">0</span>
                    </div>
                    <div class="flex justify-between items-center border-t pt-2 border-slate-100">
                        <span class="text-xs font-bold text-slate-400">TU RÉCORD</span>
                        <span id="highScore" class="font-game text-2xl text-purple-600">0</span>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-2.5">
                    <button type="button" id="restartBtn" class="btn-bounce bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-game text-lg py-3 px-7 rounded-full shadow-lg border-2 border-white">
                        Jugar de Nuevo 🔄
                    </button>
                    <button type="button" id="changeCharOverBtn" class="btn-bounce bg-white hover:bg-slate-50 text-slate-700 font-game text-base py-3 px-5 rounded-full shadow border-2 border-slate-200">
                        Cambiar Animal
                    </button>
                </div>
            </div>
        </div>

        <!-- Barra de Controles Inferior -->
        <div class="w-full flex justify-between items-center mt-2.5 px-2 text-xs text-slate-600 font-semibold">
            <span>Mueve con el dedo, el ratón o las flechas ⬅️ ➡️</span>
            <button type="button" id="pauseBtn" class="text-slate-700 hover:text-slate-900 font-bold bg-white/85 px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm">
                Pausa ⏸️
            </button>
        </div>
    </div>

    <script>
        // --- Audio seguro ---
        let audioCtx = null;
        function initAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC && !audioCtx) audioCtx = new AC();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'catch') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'bad') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'combo') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
                    osc.start(now);
                    osc.stop(now + 0.26);
                } else if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            } catch (e) {}
        }

        // --- Configuración con tus archivos de imagen reales ---
        const CHARACTERS = {
            giraffe: {
                id: 'giraffe',
                name: 'la Jirafa',
                fallbackEmoji: '🦒',
                logoSrc: 'logo-jirafa.png',
                animalSrc: 'jirafa.png',
                bannerBg: '#fef5d4',
                fruitEmoji: '🍑',
                fruitName: 'melocotones',
                pageBg: 'bg-[#fef5d4]',
                canvasGradient: ['#fef9e3', '#fdebc8'],
                titleColor: 'text-amber-600',
                btnGradient: 'from-amber-500 to-orange-500',
                legendBorder: 'border-amber-300',
                goodItems: [
                    { emoji: '🍑', name: 'Melocotón' },
                    { emoji: '🌱', name: 'Soja' }
                ]
            },
            panda: {
                id: 'panda',
                name: 'el Oso Panda',
                fallbackEmoji: '🐼',
                logoSrc: 'logo-panda.png',
                animalSrc: 'panda.png',
                bannerBg: '#fce2e6',
                fruitEmoji: '🍓',
                fruitName: 'fresas',
                pageBg: 'bg-[#fce2e6]',
                canvasGradient: ['#fce8eb', '#fad4db'],
                titleColor: 'text-pink-600',
                btnGradient: 'from-pink-500 to-rose-500',
                legendBorder: 'border-pink-300',
                goodItems: [
                    { emoji: '🍓', name: 'Fresa' },
                    { emoji: '🌱', name: 'Soja' }
                ]
            },
            crocodile: {
                id: 'crocodile',
                name: 'el Cocodrilo',
                fallbackEmoji: '🐊',
                logoSrc: 'logo-cocodrilo.png',
                animalSrc: 'cocodrilo.png',
                bannerBg: '#d7f5cb',
                fruitEmoji: '🍋',
                fruitName: 'limones',
                pageBg: 'bg-[#d7f5cb]',
                canvasGradient: ['#e2f8d8', '#c7f0b6'],
                titleColor: 'text-emerald-600',
                btnGradient: 'from-emerald-500 to-green-600',
                legendBorder: 'border-emerald-300',
                goodItems: [
                    { emoji: '🍋', name: 'Limón' },
                    { emoji: '🌱', name: 'Soja' }
                ]
            }
        };

        // Precargar imágenes reales desde el repositorio
        const loadedAnimalImgs = {};
        Object.keys(CHARACTERS).forEach(key => {
            const img = new Image();
            img.src = CHARACTERS[key].animalSrc;
            loadedAnimalImgs[key] = img;
        });

        const BAD_ITEMS = [
            { emoji: '🦠', name: 'Bacteria' },
            { emoji: '🪰', name: 'Mosca' }
        ];

        // --- Referencias UI ---
        const pageBody = document.getElementById('pageBody');
        const brandBanner = document.getElementById('brandBanner');
        const logoImage = document.getElementById('logoImage');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('startScreen');
        const pauseScreen = document.getElementById('pauseScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        const startBtn = document.getElementById('startBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const restartBtn = document.getElementById('restartBtn');
        const restartPauseBtn = document.getElementById('restartPauseBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const changeCharPauseBtn = document.getElementById('changeCharPauseBtn');
        const changeCharOverBtn = document.getElementById('changeCharOverBtn');

        const welcomeTitle = document.getElementById('welcomeTitle');
        const legendBox = document.getElementById('legendBox');
        const legendGoodEmoji = document.getElementById('legendGoodEmoji');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const comboDisplay = document.getElementById('comboDisplay');
        const livesContainer = document.getElementById('livesContainer');
        const finalScoreDisplay = document.getElementById('finalScore');
        const highScoreDisplay = document.getElementById('highScore');

        // --- Estado del Juego ---
        let selectedCharKey = 'giraffe';
        let gameState = 'START';
        let score = 0;
        let lives = 3;
        let combo = 0;
        let highScore = 0;
        try {
            highScore = parseInt(localStorage.getItem('soyajoy_high_score')) || 0;
        } catch (e) {}

        let lastTime = 0;
        let spawnTimer = 0;
        const BASE_SPAWN_INTERVAL = 1550;

        const player = {
            x: 150,
            y: 300,
            width: 105,
            height: 110,
            speed: 440,
            eatScale: 0
        };

        let items = [];
        let particles = [];
        const keys = { left: false, right: false };

        function selectCharacter(charKey) {
            selectedCharKey = charKey;
            const cfg = CHARACTERS[charKey];

            brandBanner.style.backgroundColor = cfg.bannerBg;
            logoImage.src = cfg.logoSrc;

            pageBody.className = `${cfg.pageBg} min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-300`;
            canvas.style.background = `linear-gradient(180deg, ${cfg.canvasGradient[0]} 0%, ${cfg.canvasGradient[1]} 100%)`;

            welcomeTitle.className = `text-2xl sm:text-3xl font-game ${cfg.titleColor} mb-1`;
            startBtn.className = `btn-bounce bg-gradient-to-r ${cfg.btnGradient} text-white font-game text-xl sm:text-2xl py-3 px-12 rounded-full shadow-lg border-2 border-white`;
            legendBox.className = `grid grid-cols-2 gap-2 text-xs text-left bg-white/90 p-3 rounded-2xl mb-5 w-full max-w-sm border-2 ${cfg.legendBorder}`;
            legendGoodEmoji.textContent = `${cfg.fruitEmoji} 🌱`;

            document.querySelectorAll('.character-card').forEach(card => {
                const isSelected = card.dataset.char === charKey;
                card.classList.toggle('selected', isSelected);
                card.classList.remove('border-amber-500', 'border-pink-500', 'border-emerald-500', 'border-transparent');
                if (isSelected) {
                    if (charKey === 'giraffe') card.classList.add('border-amber-500');
                    if (charKey === 'panda') card.classList.add('border-pink-500');
                    if (charKey === 'crocodile') card.classList.add('border-emerald-500');
                } else {
                    card.classList.add('border-transparent');
                }
            });

            resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlayer(0);
        }

        document.querySelectorAll('.character-card').forEach(card => {
            card.addEventListener('click', () => {
                initAudio();
                playSound('select');
                selectCharacter(card.dataset.char);
            });
        });

        function resizeCanvas() {
            const rect = canvasWrapper.getBoundingClientRect();
            canvas.width = rect.width > 0 ? rect.width : 400;
            canvas.height = rect.height > 0 ? rect.height : 450;

            player.width = Math.max(92, canvas.width * 0.25);
            player.height = player.width * 1.05;
            player.y = canvas.height - player.height - 10;

            if (gameState === 'START') {
                player.x = canvas.width / 2 - player.width / 2;
            } else {
                clampPlayerPosition();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'p' || e.key === 'P') togglePause();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        let isDragging = false;

        function handlePointerMove(e) {
            if (gameState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const touchX = clientX - rect.left;
            player.x = touchX - player.width / 2;
            clampPlayerPosition();
        }

        canvas.addEventListener('mousedown', (e) => { isDragging = true; handlePointerMove(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDragging) handlePointerMove(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('touchstart', (e) => { isDragging = true; handlePointerMove(e); }, { passive: true });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: true });
        canvas.addEventListener('touchend', () => { isDragging = false; });

        function clampPlayerPosition() {
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }

        function spawnItem() {
